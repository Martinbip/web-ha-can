# Nginx config cho dhakimloaimau.vn
# QUAN TRỌNG: File này là template. Trên server, Certbot đã thêm SSL.
# deploy.sh KHÔNG ghi đè trực tiếp — chỉ đồng bộ các location block.

server {
    server_name dhakimloaimau.vn www.dhakimloaimau.vn;

    root /var/www/dhakimloaimau.vn;
    index index.html;

    # Ảnh tải lên tối đa 5MB (dha-api/src/services/media.js); chừa chỗ cho multipart
    client_max_body_size 10M;

    # ── dha-api (thay Strapi từ 2026-09) ────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Trang chi tiết tin tức: /tin-tuc/<duong-dan> ────
    # Mọi địa chỉ dưới /tin-tuc/ đều do news-detail.html dựng, slug nằm ở đường
    # dẫn chứ không phải query string.
    location /tin-tuc/ {
        try_files $uri /news-detail.html;
    }

    # Địa chỉ cũ /news-detail?slug=... chuyển vĩnh viễn sang dạng mới, để link
    # đã chia sẻ trước đó không chết.
    location = /news-detail {
        if ($arg_slug) {
            return 301 /tin-tuc/$arg_slug;
        }
        return 301 /news;
    }

    # ── Redirect .html URLs to clean URLs (SEO) ─────────
    location ~ ^(.+)\.html$ {
        return 301 $1;
    }

    # ── Custom React Admin (static, served at /admin) ───
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    # ── Frontend static files ───────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|svg|ico|webp|woff2|woff|ttf|css|js)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ẩn các file nhạy cảm
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }

    # SSL được quản lý bởi Certbot trên server — không commit vào repo
}
